name: Deploy to GitHub Pages

# Builds the trainer and publishes it to GitHub Pages on every push to main.
# The build runs typecheck + the honesty tests first, so a broken mechanic
# definition never reaches the raid.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Honesty tests
        run: npm test

      # The balance sweep, compared against its committed per-cell baseline.
      # It had no assertion and no exit code until now, `npm test` never matched
      # it, and nothing here ran it — so nine failing cells sat next to a green
      # build for the life of the project. A cell changing in EITHER direction
      # now fails: a fight getting easier is the one a trainer should fear most,
      # and no aggregate score can see it.
      - name: Balance sweep
        run: npm run playtest

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
